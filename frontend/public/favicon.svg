<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366" />
      <stop offset="100%" stop-color="#001f3f" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7dc6f" />
      <stop offset="50%" stop-color="#f2cc4d" />
      <stop offset="100%" stop-color="#d4ac0d" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="14" fill="url(#ueGradient)" stroke="#f2cc4d" stroke-width="2"/>

  <!-- Outer Bearing Ring (Raceway) -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="url(#goldGradient)" stroke-width="3.5"/>
  <circle cx="32" cy="32" r="18" fill="none" stroke="#f2cc4d" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- Inner Bearing Ring -->
  <circle cx="32" cy="32" r="10.5" fill="#001f3f" stroke="url(#goldGradient)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="5" fill="#003366" stroke="#f2cc4d" stroke-width="1"/>

  <!-- Bearing Balls (Rollers) in Circular Orbit -->
  <!-- 8 Bearing Balls -->
  <circle cx="32" cy="17.5" r="3.2" fill="url(#goldGradient)" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="42.25" cy="21.75" r="3.2" fill="url(#goldGradient)" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="46.5" cy="32" r="3.2" fill="url(#goldGradient)" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="42.25" cy="42.25" r="3.2" fill="url(#goldGradient)" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="32" cy="46.5" r="3.2" fill="url(#goldGradient)" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="21.75" cy="42.25" r="3.2" fill="url(#goldGradient)" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="17.5" cy="32" r="3.2" fill="url(#goldGradient)" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="21.75" cy="21.75" r="3.2" fill="url(#goldGradient)" stroke="#ffffff" stroke-width="0.8"/>

  <!-- Center Pivot Core -->
  <circle cx="32" cy="32" r="2" fill="#f2cc4d"/>
</svg>
